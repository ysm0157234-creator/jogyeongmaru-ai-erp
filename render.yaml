databases:
  - name: jogyeongmaru-ai-erp-db
    plan: free
    region: singapore
    databaseName: jogyeongmaru_erp
    user: jogyeongmaru_erp
    postgresMajorVersion: "17"

services:
  - type: web
    name: jogyeongmaru-ai-erp-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: jogyeongmaru-ai-erp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: ADMIN_EMAIL
        value: admin@jogyeongmaru.co.kr
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SHIPMENT_OVERVIEW_FILE_ID
        value: "1ivbvqCc7jeA9dX23nW3jpjpDQ3R_NBuw"
      - key: IMPORT_2025_FOLDER_ID
        sync: false
      - key: IMPORT_2024_FOLDER_ID
        sync: false
      - key: IMPORT_2023_FOLDER_ID
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: ""

  - type: web
    name: jogyeongmaru-ai-erp-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
      - key: VITE_API_URL
        value: https://jogyeongmaru-ai-erp-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
