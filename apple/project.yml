name: GestureRemote
options:
  bundleIdPrefix: com.example.gestureremote
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  GestureRemote:
    type: application
    platform: iOS
    sources:
      - path: iPhoneApp
    info:
      path: iPhoneApp/Info.plist
      properties:
        CFBundleDisplayName: Gesture Remote
        NSLocalNetworkUsageDescription: Windows 또는 Mac 컴퓨터에 연결하기 위해 로컬 네트워크를 사용합니다.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoosungmu.gestureremote
    dependencies:
      - target: GestureRemoteWatch
  GestureRemoteWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Gesture Remote
        NSMotionUsageDescription: 손목 제스처를 감지하여 컴퓨터를 제어합니다.
        WKCompanionAppBundleIdentifier: com.yoosungmu.gestureremote
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoosungmu.gestureremote.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
  GestureRemoteMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: MacApp
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: Gesture Remote Mac
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yoosungmu.gestureremote.mac
        CODE_SIGN_STYLE: Automatic
